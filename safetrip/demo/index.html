<style>
/* Un solo sistema, cinco entornos. Arriba se elige el rol; a la derecha se ve cómo se conectan. */
:root{
  --night:#0a111c;--panel:#101a29;--raise:#172435;--raise2:#1e2d42;--line:#25344a;
  --ink:#edf2f8;--mut:#93a4bb;--accent:#3d7bff;
  --ok:#35c98d;--warn:#f5b93a;--crit:#ff5a5f;
  --display:Archivo,"Arial Narrow",system-ui,sans-serif;--body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --role:#3d7bff;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:500 14px/1.45 var(--body);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;min-height:680px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:58px 44px minmax(0,1fr) 64px}

/* Barra superior y roles */
.top{display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand svg{height:30px;width:auto;display:block}
.roles{display:flex;gap:4px;margin:0 auto;background:var(--night);padding:4px;border-radius:12px}
.rb{position:relative;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut);transition:background .15s,color .15s}
.rb:hover{color:var(--ink)}
.rb[aria-selected=true]{background:var(--rc);color:#06101f}
.rb .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font:800 10px/17px var(--body);text-align:center;padding:0 4px;animation:pop .35s}
@keyframes pop{from{transform:scale(0)}}
.op{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
.op .plate{background:#fff;border-radius:6px;padding:3px 7px;display:flex}
.op img{height:22px;width:auto;display:block}

/* Contexto del entorno */
.ctx{display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--role) 13%,var(--night));border-bottom:1px solid var(--line);font-size:13px}
.ctx .chip{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--role);font-family:var(--display);font-size:14px}
.ctx span{color:var(--mut)}
.ctx .sim{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--warn);white-space:nowrap}

/* Escenario */
.stage{display:grid;grid-template-columns:196px minmax(0,1fr) 262px;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.side h2{font:600 11px var(--body);color:var(--mut);margin:4px 8px 6px;letter-spacing:.04em}
.nv{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mut);text-align:left;width:100%}
.nv:hover{background:var(--raise);color:var(--ink)}
.nv[aria-current=page]{background:color-mix(in srgb,var(--role) 20%,transparent);color:var(--ink)}
.nv[aria-current=page] svg{color:var(--role)}
.nv em{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--crit);border-radius:8px;padding:0 6px}
.side .mod{margin-top:auto;font-size:11.5px;color:var(--mut);padding:8px;border-top:1px solid var(--line)}
.main{padding:16px 18px;overflow:auto;min-width:0}
h1{font:800 21px/1.15 var(--display);margin:0;text-wrap:balance}
.sub{margin:3px 0 14px;color:var(--mut);font-size:13.5px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g73{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.g37{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.k small{display:block;color:var(--mut);font-size:11.5px;font-weight:600}
.k b{font:800 22px/1.2 var(--display)}
.k i{font-style:normal;font-size:11.5px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;min-width:0}
.card h2{font:800 14.5px var(--display);margin:0 0 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{font:600 12px var(--body);color:var(--mut)}
.stack{display:grid;gap:12px;align-content:start}
label,.lab{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:4px}
select,.txt{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.txt:focus{border-color:var(--role)}
.seg{display:grid;gap:5px}.seg.v{grid-template-columns:repeat(4,1fr)}.seg.k3{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;font-weight:600;font-size:12.5px}
.opt small{display:block;color:var(--mut);font-size:11px;font-weight:500}
.opt:hover{border-color:#3b5170}
.opt[aria-pressed=true]{border-color:var(--role);background:color-mix(in srgb,var(--role) 16%,transparent)}
.big{font:900 34px/1.05 var(--display)}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)}
.ln b{color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 2px}
.note{border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600}
.note.ok{background:rgba(53,201,141,.12);color:#7fe3b8}.note.bad{background:rgba(255,90,95,.14);color:#ffa3a6}.note.warn{background:rgba(245,185,58,.12);color:var(--warn)}.note.info{background:rgba(61,123,255,.14);color:#a8c4ff}
.btn{background:var(--accent);color:#fff;border-radius:9px;padding:10px 14px;font-weight:700;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn[disabled]{background:var(--raise);color:var(--mut);cursor:not-allowed;filter:none}
.btn.full{width:100%}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.ghost{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-weight:700;background:var(--raise)}
.ghost:hover{border-color:#3b5170}
.ghost.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--mut);font-weight:700;padding:5px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(37,52,74,.55)}
tr:last-child td{border-bottom:0}
tr.me td{background:color-mix(in srgb,var(--role) 12%,transparent)}
td.r,th.r{text-align:right}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.mut{color:var(--mut)}.acc{color:#8fb2ff}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 11px 22px;color:var(--mut);font-size:13px}
.tl li::before{content:'';position:absolute;left:3px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl li::after{content:'';position:absolute;left:7.5px;top:15px;bottom:-3px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.d{color:var(--ink)}.tl li.d::before{background:var(--ok)}
.tl li.n{color:var(--ink);font-weight:700}.tl li.n::before{background:var(--role);box-shadow:0 0 0 4px color-mix(in srgb,var(--role) 28%,transparent)}
.bar{height:6px;background:var(--raise);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.empty{color:var(--mut);text-align:center;padding:22px 10px;font-size:13.5px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:16px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars i{display:block;width:100%;max-width:44px;background:var(--raise2);border-radius:5px 5px 0 0}
.bars .now i{background:var(--role)}
.bars b{font-size:11.5px;font-weight:700}.bars small{font-size:11px;color:var(--mut)}

/* Mapa */
.mapbox{position:relative;background:#0c1524;border:1px solid var(--line);border-radius:11px;overflow:hidden}
svg.map{display:block;width:100%;height:100%}
.colombia{fill:#142033;stroke:#2c3f5c;stroke-width:1.2}
.edge{fill:none;stroke-linecap:round;stroke-width:2.2;stroke-opacity:.5}
.routeb{fill:none;stroke:var(--accent);stroke-width:7;stroke-opacity:.32;stroke-linecap:round}
.routed{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.cn{fill:#b9c6d8;font:600 12px var(--body);paint-order:stroke;stroke:#0a111c;stroke-width:3px}
.cn.e{fill:#fff;font-weight:700}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.9s ease-out infinite}
@keyframes pl{from{transform:scale(.5);opacity:.8}to{transform:scale(2.6);opacity:0}}
.lg{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;font-size:11px;color:var(--mut);background:rgba(16,26,41,.9);border-radius:7px;padding:4px 8px}
.lg i{display:inline-block;width:13px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* Conductor */
.drv{display:grid;grid-template-columns:minmax(0,1fr) 288px minmax(0,1fr);gap:16px;align-items:center;min-height:100%}
.phone{width:288px;height:578px;max-height:100%;background:#05090f;border:7px solid #1e2a3b;border-radius:34px;display:flex;flex-direction:column;overflow:hidden;position:relative;justify-self:center}
.pstat{display:flex;justify-content:space-between;padding:8px 18px 3px;font-size:11px;font-weight:700;color:var(--mut)}
.pbody{flex:1;min-height:0;padding:8px 13px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.pbody.red{background:#3a0d13}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1a2636;background:#0a111c}
.ptabs button{padding:7px 2px 8px;font-size:10.5px;font-weight:700;color:var(--mut);display:grid;justify-items:center;gap:2px;position:relative}
.ptabs button[aria-current=page]{color:var(--role)}
.ptabs em{position:absolute;top:3px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
.ph{font:800 19px/1.15 var(--display);margin:0}.ps{color:var(--mut);font-size:12.5px;margin:0}
.pc{background:#101a28;border-radius:11px;padding:9px 12px}
.pc small{display:block;font-size:11px;color:var(--mut);font-weight:600}.pc b{font:800 15px/1.25 var(--display)}
.pay{font:900 26px/1.1 var(--display);color:var(--ok)}
.pb{border-radius:11px;padding:11px;font-weight:700;width:100%}
.pb.go{background:var(--accent);color:#fff}.pb.no{background:#101a28}.pb.ok{background:var(--ok);color:#07241a}.pb.white{background:#fff;color:#3a0d13}
.sp{margin-top:auto;display:grid;gap:7px}
.panic{position:relative;overflow:hidden;background:var(--crit);color:#fff;border-radius:11px;padding:12px;font-weight:800;width:100%;touch-action:none;user-select:none}
.panic i{position:absolute;inset:0;background:rgba(0,0,0,.3);transform:scaleX(0);transform-origin:left}.panic span{position:relative}
.chk{display:flex;justify-content:space-between;align-items:center;background:#101a28;border-radius:11px;padding:10px 12px;font-weight:600;width:100%;text-align:left}
.chk em{font-style:normal;font-size:12px;color:var(--mut)}.chk.d em{color:var(--ok);font-weight:700}
.ring{animation:rg .6s ease-in-out 3}@keyframes rg{25%{transform:rotate(-1.3deg)}75%{transform:rotate(1.3deg)}}
.exp h2{font:800 16px var(--display);margin:0 0 6px}.exp p{color:var(--mut);margin:0 0 10px;font-size:13.5px}
.exp ul{margin:0;padding-left:16px;color:var(--mut);font-size:13px;display:grid;gap:4px}

/* Línea conectada */
.rail{background:var(--panel);border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;min-height:0}
.rail h2{font:800 14px var(--display);margin:0}
.rail p{margin:1px 0 9px;font-size:12px;color:var(--mut)}
.feed{display:grid;gap:7px;overflow-x:hidden;overflow-y:auto;align-content:start;flex:1;min-height:0}
.ev{border-left:3px solid var(--c);padding:1px 0 1px 8px;font-size:12.5px;line-height:1.3}
.ev.nw{animation:evn .4s}
@keyframes evn{from{opacity:0;transform:translateX(8px)}}
.ev b{display:block;font-size:11px;color:var(--c);font-weight:800}
.ev small{color:var(--mut);font-size:11px}

/* Guía */
.guide{display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-top:1px solid var(--line)}
.steps{display:flex;gap:4px;flex:none}
.steps span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 11px var(--display);background:var(--raise);color:var(--mut)}
.steps span.d{background:var(--ok);color:#07241a}.steps span.n{background:var(--accent);color:#fff}
.hint{font-weight:700;min-width:0;font-size:14px}.hint small{display:block;color:var(--mut);font-weight:500;font-size:12.5px}
.gact{margin-left:auto;display:flex;gap:8px;flex:none}

/* Capas */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov.on{display:flex}
.modal{background:#2a0f14;border:1px solid var(--crit);border-radius:13px;padding:20px;max-width:440px;width:100%}
.modal h2{font:800 19px var(--display);margin:0;color:#ffb3b5}.modal p{margin:3px 0 10px;color:#f0c9ca;font-size:13.5px}
.modal ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:5px;font-size:13.5px;color:#c9a0a2}
.modal li.d{color:#fff}.modal li.d::before{content:'✓ ';color:var(--ok)}.modal li:not(.d)::before{content:'· '}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#0a111c;font-weight:700;border-radius:10px;padding:10px 16px;display:none;z-index:8;max-width:calc(100vw - 32px);font-size:13.5px}
.toast.on{display:block}

@media(max-width:1180px){
  html,body{height:auto}
  .app{height:auto;grid-template-rows:auto auto auto auto}
  .top{flex-wrap:wrap;padding:10px 12px;gap:8px}.roles{order:3;width:100%;overflow:auto;margin:0}.rb{flex:none}
  .ctx{flex-wrap:wrap;padding:7px 12px;gap:4px 10px}.ctx .sim{margin-left:0}
  .stage{grid-template-columns:minmax(0,1fr)}.side{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side h2,.side .mod{display:none}.nv{width:auto;flex:none}
  .rail{border-left:0;border-top:1px solid var(--line);max-height:260px}
  .main{padding:12px}.g2,.g73,.g37{grid-template-columns:minmax(0,1fr)}.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.mapbox{height:380px!important}.seg.v{grid-template-columns:1fr 1fr}
  .drv{grid-template-columns:1fr}.drv .exp{display:none}.phone{height:560px;max-height:none}
  .guide{flex-wrap:wrap;padding:8px 12px;gap:8px}.gact{margin-left:0}
  .tw{overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){.pulse,.ring,.ev,.rb .badge{animation:none}}
</style>
</head>

  if(S.stage!=='none')return `<div class="head"><div><h1>Viaje ST-${S.id} reservado</h1><p class="sub">${S.o} → ${S.d} · ${V[S.v].n} · ${K[S.k].n}</p></div></div><div class="note ok">Tu reserva ya está en Despacho. Sigue el viaje en Mis viajes.</div><p></p><button class="btn" data-a="nav" data-v="cliente|viajes">Ver mis viajes</button>`;
  const q=quote(),bad=q.price<q.min,al=S.alerts.find(a=>!a.done&&a.ok&&q.r.path.includes(a.e[0])&&q.r.path.includes(a.e[1]));
  return `<h1>Cotiza tu carga en segundos</h1><p class="sub">Precio al instante, sin bajar del costo mínimo de la ruta.</p>
  <div class="g37"><div class="stack"><div class="card stack" style="gap:10px">
    <div class="g2" style="gap:8px"><div><label for="fo">Ciudad de origen</label><select id="fo"></select></div><div><label for="fd">Ciudad de destino</label><select id="fd"></select></div></div>
    <div><label for="ao">Dirección exacta de cargue</label><input class="txt" id="ao" autocomplete="off" value="${dirOf('o')}"></div>
    <div><label for="ad">Dirección exacta de entrega</label><input class="txt" id="ad" autocomplete="off" value="${dirOf('d')}"></div>
    <div><span class="lab">Vehículo</span><div class="seg v" style="grid-template-columns:1fr 1fr">${V.map((x,i)=>`<button class="opt" data-a="setv" data-v="${i}" aria-pressed="${i===S.v}">${x.n}<small>${x.d}</small></button>`).join('')}</div></div>
    <div><span class="lab">Carga</span><div class="seg k3">${K.map((x,i)=>`<button class="opt" data-a="setk" data-v="${i}" aria-pressed="${i===S.k}">${x.n}</button>`).join('')}</div></div>
  </div></div>
  <div class="stack"><div class="card"><div class="ln"><span>Flete sugerido</span><span>${q.r.km.toLocaleString('es-CO')} km · ${q.h} h · riesgo <b style="color:${RC[q.risk]}">${RN[q.risk]}</b></span></div>
    <div class="big" id="pv">${money(q.price)}</div><input type="range" id="pr" min="70" max="125" value="${S.pct}" aria-label="Precio a pactar">
    <div class="ln"><span>Costo mínimo de ejemplo <b>${money(q.min)}</b></span></div>
    <div class="note ${bad?'bad':'ok'}" id="nt" style="margin:8px 0">${bad?'Bloqueado: queda por debajo del costo mínimo de la ruta.':'Precio dentro de la norma.'}</div>
    ${al?`<div class="note warn" style="margin-bottom:8px">Alerta en la ruta: ${al.t}, ${al.w}.</div>`:''}
    <button class="btn full" id="res" data-a="reservar" ${bad?'disabled':''}>Reservar por ${money(q.price)}</button></div>
    <div class="mapbox" style="height:274px">${map({route:q.r,vb:'120 8 400 480'})}</div></div></div>`;
 },
 viajes(){
  if(S.stage==='none')return `<h1>Mis viajes</h1><p class="sub">Aquí sigues cada carga sin llamar a nadie.</p><div class="card empty">Aún no tienes viajes activos. Cotiza tu primera carga.</div>`;
  const st=[['Reservado',true],['Conductor asignado',ix('aceptado')],['Cargue con fotos',ix('ruta')],['En ruta',ix('entrega')],['Entrega y cumplido',ix('cumplido')]];
  const now=!ix('aceptado')?1:!ix('ruta')?2:!ix('entrega')?3:!ix('cumplido')?4:9;
  return `<h1>Viaje ST-${S.id}</h1><p class="sub">${S.o} → ${S.d} · ${V[S.v].n} · ${K[S.k].n}</p>
  <div class="g73"><div class="mapbox" style="height:min(62vh,500px)">${map({route:T().r,alerts:false})}</div><div class="stack">
  ${S.stage==='alerta'?'<div class="note warn">Novedad en la ruta: el conductor se detuvo en un punto recomendado. Tu carga está monitoreada.</div>':''}
  <div class="card"><h2>Estado</h2><ul class="tl">${st.map((x,i)=>`<li class="${i===now?'n':x[1]?'d':''}">${x[0]}</li>`).join('')}</ul></div>
  <div class="card"><div class="ln"><span>Cargue</span><b>${T().ao}</b></div><div class="ln"><span>Entrega</span><b>${T().ad}</b></div><div class="ln"><span>Conductor</span><b>${ix('aceptado')?'Jairo R. · identidad validada':'Por asignar'}</b></div><div class="ln"><span>Vehículo</span><b>${ix('aceptado')?T().v.p:'—'}</b></div><div class="ln"><span>Faltan</span><b data-live="km">—</b></div>${S.k===1?'<div class="ln"><span>Temperatura</span><b class="ok">−18,4 °C</b></div>':''}</div>
  </div></div>`;
 },
 docs(){
  if(!ix('cumplido'))return `<h1>Cumplidos y facturas</h1><p class="sub">Cada entrega llega con foto, GPS y firma.</p><div class="card empty">El cumplido aparece aquí apenas el conductor entregue.</div>`;
  return `<h1>Cumplidos y facturas</h1><p class="sub">Soportes listos para tu contabilidad y auditorías.</p><div class="g2"><div class="card"><h2>Cumplido ST-${S.id} <span class="st ok">Aprobado</span></h2><div class="ln"><span>Foto de la entrega</span><b>Lista</b></div><div class="ln"><span>Ubicación GPS</span><b>${T().ad}, ${S.d}</b></div><div class="ln"><span>Firma</span><b>Recibido a conformidad</b></div></div>
  <div class="card"><h2>Factura electrónica <span class="st ${S.fac?'ok':'warn'}">${S.fac?'Emitida':'En proceso'}</span></h2><div class="ln"><span>Valor</span><b>${money(T().price)}</b></div><div class="ln"><span>Emisor</span><b>Safe Trip S.A.S.</b></div></div></div>`;
 }},
/* ---------- Despacho ---------- */
despacho:{
 torre(){
  const trips=[...TRIPS];if(ix('aceptado')&&!ix('pagado'))trips.unshift([`ST-${S.id}`,`${S.o} → ${S.d}`,T().v.p,'Aliado',stageTxt(),S.stage==='alerta'?'crit':'ok']);
  return `<h1>Torre de control</h1><p class="sub">Flota propia y vehículos aliados en una sola pantalla.</p>
  <div class="kp"><div class="k"><small>Viajes activos</small><b>${ix('aceptado')&&!ix('entrega')?19:18}</b></div><div class="k"><small>A tiempo</small><b>96%</b></div><div class="k"><small>Alertas activas</small><b class="crit">${S.alerts.filter(a=>!a.done).length}</b></div><div class="k"><small>Retornos llenos</small><b>${S.ret?8:7}</b></div></div>
  <div class="g2"><div class="mapbox" style="height:min(56vh,440px)">${map({route:T()?T().r:null,alerts:true})}</div><div class="stack">
  ${S.stage==='alerta'?`<div class="note bad">Alerta en la ruta de ST-${S.id}: ${S.aw}. Conductor ${S.stopped?'detenido en punto recomendado':'avisado'}.</div>`:''}
  ${S.stage==='reservado'?`<div class="note info">Viaje ST-${S.id} sin asignar. <button class="ghost sm" data-a="nav" data-v="despacho|asignar">Asignar</button></div>`:''}
  <div class="card tw"><h2>Viajes</h2><table><thead><tr><th>Viaje</th><th>Ruta</th><th>Vehículo</th><th>Estado</th></tr></thead><tbody>${trips.slice(0,6).map(t=>`<tr class="${t[0]==='ST-'+S.id?'me':''}"><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}<br><small class="mut">${t[3]}</small></td><td><span class="st ${t[5]}">${t[4]}</span></td></tr>`).join('')}</tbody></table></div></div></div>`;
 },
 asignar(){
  if(S.stage==='none')return `<h1>Asignación</h1><p class="sub">Los viajes nuevos llegan aquí.</p><div class="card empty">No hay viajes por asignar.</div>`;
  if(S.stage!=='reservado')return `<h1>Asignación</h1><p class="sub">ST-${S.id} · ${S.o} → ${S.d}</p><div class="note ok">${S.stage==='ofertado'?'Oferta enviada. Esperando al conductor.':'Asignado a Jairo R.'}</div>`;
  return `<h1>Asignar ST-${S.id}</h1><p class="sub">${S.o} → ${S.d} · ${V[S.v].n} · ${money(T().price)}<br>Cargue: ${T().ao}, ${S.o} · Entrega: ${T().ad}, ${S.d}</p><div class="card tw"><h2>Conductores calificados <span>Ordenados por cercanía y calificación</span></h2><table><thead><tr><th>Conductor</th><th>Vehículo</th><th>Distancia</th><th>Calificación</th><th>Documentos</th><th></th></tr></thead><tbody>
  <tr class="me"><td>Jairo R.</td><td>${T().v.p} · Aliado</td><td>12 km</td><td>4,9</td><td><span class="st ok">Al día</span></td><td class="r"><button class="btn sm" data-a="ofertar">Enviar oferta</button></td></tr>
  <tr><td>Luis M.</td><td>XKT 118 · Propio</td><td>Ocupado</td><td>4,8</td><td><span class="st ok">Al día</span></td><td></td></tr>
  <tr><td>Diego L.</td><td>NHR 204 · Aliado</td><td>31 km</td><td>4,6</td><td><span class="st crit">SOAT vencido</span></td><td class="r mut">Bloqueado</td></tr></tbody></table></div><p></p><div class="note info">Sin documentos al día, Flett no le ofrece viajes a un vehículo.</div>`;
 },
 flota(){return `<h1>Flota y documentos</h1><p class="sub">Propios y aliados, con alertas antes de que venza algo.</p><div class="card tw"><table><thead><tr><th>Vehículo</th><th>Tipo</th><th>Vínculo</th><th>Conductor</th><th>SOAT</th><th>Tecnomecánica</th><th>Estado</th></tr></thead><tbody>${FLEET.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td><td>${f[4]}</td><td>${f[5]}</td><td><span class="st ${f[6]}">${f[6]==='ok'?'Habilitado':f[6]==='warn'?'Por vencer':'Bloqueado'}</span></td></tr>`).join('')}</tbody></table></div>`},
 retornos(){return `<h1>Retornos</h1><p class="sub">Cada regreso vacío se convierte en carga para otra empresa.</p><div class="kp"><div class="k"><small>Regresos vacíos este mes</small><b>14</b></div><div class="k"><small>Llenados</small><b>${S.ret?8:7}</b></div><div class="k"><small>Ingreso extra</small><b>${S.ret?'$24 M':'$21 M'}</b></div><div class="k"><small>Comisión Flett</small><b>8%</b></div></div><div class="card tw"><h2>Disponibles</h2><table><thead><tr><th>Ruta</th><th>Vehículo</th><th>Sale</th><th class="r">Oferta</th><th></th></tr></thead><tbody>
  <tr class="${ix('pagado')?'me':''}"><td>${ix('cumplido')?S.d+' → '+S.o:'Barranquilla → Bogotá'}</td><td>XKT 482</td><td>Mañana 6:00</td><td class="r">$3.000.000</td><td class="r">${S.ret?'<span class="st ok">Llenado</span>':ix('cumplido')?'<button class="btn sm" data-a="retorno">Publicar y llenar</button>':'<span class="mut">Disponible al entregar</span>'}</td></tr>
  <tr><td>Cartagena → Medellín</td><td>TSM 219</td><td>Hoy 18:00</td><td class="r">$2.100.000</td><td class="r"><span class="st warn">Buscando</span></td></tr></tbody></table></div>`},
 alertas(){return `<h1>Red de alertas</h1><p class="sub">Reportes de camioneros de todo el país, confirmados antes de difundirse.</p><div class="g2"><div class="mapbox" style="height:min(60vh,470px)">${map({route:active()?T().r:null,alerts:true})}</div><div class="stack"><div class="card"><h2>Alertas <span>${S.alerts.filter(a=>!a.done).length} activas</span></h2><div class="stack" style="gap:7px">${S.alerts.slice(0,5).map(a=>`<div class="ln" style="align-items:center"><span><b>${a.t}</b><br><small>${a.w} · ${a.ago}</small></span>${a.done?'<span class="st ok">Resuelta</span>':a.ok?`<span class="st crit">Avisó a ${a.n}</span>`:`<button class="ghost sm" data-a="confirmar" data-v="${a.id}">Confirmar</button>`}</div>`).join('')}</div></div>${active()&&!S.alertUsed?'<button class="btn" data-a="robo">Simular robo adelante del camión</button>':''}</div></div>`}
},
/* ---------- Conductor ---------- */
conductor:{
 app(){
  const ex={inicio:['Inicio','Lo primero que ve el conductor: su vehículo, sus documentos y la seguridad de su zona.'],viajes:['Viajes','Ofertas claras: sabe cuánto gana antes de aceptar.'],seg:['Seguridad','Gratis para todo camionero del país. Por aquí entra a la red.'],pagos:['Pagos','Anticipo al cargar y saldo tras el cumplido. Cada peso a la vista.'],mas:['Beneficios','Servicios a la red: convenios que bajan sus costos y le generan ingresos a Flett.']}[S.ph]||['App','La misma app para todo tipo de vehículo.'];
  return `<div class="drv"><div class="exp"><h2>${ex[0]}</h2><p>${ex[1]}</p><ul><li>Funciona con poca señal</li><li>Para camión pequeño o tractomula</li><li>Conectada con Despacho y Finanzas</li></ul></div>
  <div class="phone" id="phone"><div class="pstat"><span>Flett</span><span>4G</span></div><div class="pbody" id="pbody"></div><div class="ptabs">${[['inicio','Inicio','home'],['seg','Seguridad','shield'],['pagos','Pagos','pay'],['mas','Beneficios','gift']].map(t=>`<button data-a="ptab" data-v="${t[0]}" aria-current="${S.ph===t[0]?'page':'false'}">${ic(t[2])}${t[1]}</button>`).join('')}</div></div>
  <div class="exp"><h2>Lo que pasa detrás</h2><p>${behind()}</p></div></div>`;
 }},
/* ---------- Finanzas ---------- */
finanzas:{
 pagos(){
  const own=T()?T().price*.88:0;
  return `<h1>Pagos a propietarios</h1><p class="sub">Anticipos y saldos dentro del plazo legal, solo a cuentas validadas.</p><div class="kp"><div class="k"><small>Por pagar hoy</small><b>${money(ix('aceptado')&&!S.ant?own/2+6.2e6:6.2e6)}</b></div><div class="k"><small>Vencen en 2 días</small><b>$9.400.000</b></div><div class="k"><small>Plazo legal</small><b>5 días</b></div><div class="k"><small>Meta de pago</small><b>48 h</b></div></div>
  <div class="card tw"><table><thead><tr><th>Viaje</th><th>Propietario</th><th>Concepto</th><th class="r">Valor</th><th>Plazo</th><th></th></tr></thead><tbody>
  ${ix('aceptado')?`<tr class="me"><td>ST-${S.id}</td><td>Jairo R.</td><td>Anticipo 50%</td><td class="r">${money(own/2)}</td><td>Hoy</td><td class="r">${S.ant?'<span class="st ok">Pagado</span>':'<button class="btn sm" data-a="anticipo">Pagar anticipo</button>'}</td></tr>`:''}
  ${ix('cumplido')?`<tr class="me"><td>ST-${S.id}</td><td>Jairo R.</td><td>Saldo tras cumplido</td><td class="r">${money(own/2)}</td><td>48 h</td><td class="r">${S.sal?'<span class="st ok">Pagado</span>':'<button class="btn sm" data-a="saldo">Aprobar pago</button>'}</td></tr>`:''}
  <tr><td>ST-1041</td><td>Mario G.</td><td>Saldo</td><td class="r">$3.696.000</td><td>2 días</td><td class="r"><span class="st warn">Programado</span></td></tr>
  <tr><td>ST-1039</td><td>Hugo V.</td><td>Saldo</td><td class="r">$2.530.000</td><td>Hoy</td><td class="r"><span class="st ok">Pagado</span></td></tr></tbody></table></div>`;
 },
 cartera(){return `<h1>Cartera de clientes</h1><p class="sub">Cada factura con su cumplido, lista para cobrar o convertir en liquidez.</p><div class="kp"><div class="k"><small>Por cobrar</small><b>${ix('cumplido')?'$'+Math.round((48.2e6+T().price)/1e6)+' M':'$48 M'}</b></div><div class="k"><small>Vencida</small><b class="warn">$6 M</b></div><div class="k"><small>Días promedio</small><b>28</b></div><div class="k"><small>Clientes bloqueados</small><b>1</b></div></div>
  <div class="card tw"><table><thead><tr><th>Cliente</th><th>Factura</th><th class="r">Valor</th><th>Estado</th><th></th></tr></thead><tbody>
  ${ix('cumplido')?`<tr class="me"><td>Cliente de ejemplo</td><td>ST-${S.id}</td><td class="r">${money(T().price)}</td><td><span class="st ${S.fac?'ok':'warn'}">${S.fac?'Facturada':'Lista para facturar'}</span></td><td class="r">${S.fac?'<span class="mut">Con cumplido digital</span>':'<button class="btn sm" data-a="facturar">Facturar</button>'}</td></tr>`:''}
  <tr><td>Alimentos Ejemplo S.A.</td><td>FE-2291</td><td class="r">$12.400.000</td><td><span class="st ok">Al día</span></td><td class="r"><button class="ghost sm" data-a="factoring">Pasar a factoring</button></td></tr>
  <tr><td>Manufacturas Demo</td><td>FE-2274</td><td class="r">$6.150.000</td><td><span class="st crit">Vencida 9 días</span></td><td class="r mut">Reservas bloqueadas</td></tr></tbody></table></div>`},
 liq(){const p=T()&&ix('cumplido')?T().price:0;return `<h1>Liquidación Flett</h1><p class="sub">Comisiones calculadas viaje por viaje. Sin discusiones a fin de mes.</p><div class="g2"><div class="card"><h2>Este viaje${p?` <span>ST-${S.id} · cliente nuevo</span>`:''}</h2>${p?`<div class="stack" style="gap:6px"><div class="ln"><span>Flete</span><b>${money(p)}</b></div><div class="ln"><span>Propietario 88%</span><b>${money(p*.88)}</b></div><div class="ln"><span>Safe Trip 6%</span><b>${money(p*.06)}</b></div><div class="ln"><span>Flett 6%</span><b>${money(p*.06)}</b></div></div>`:'<div class="empty">Aparece cuando el viaje se cumple.</div>'}</div><div class="card"><h2>Tarifas de Flett</h2><div class="stack" style="gap:6px"><div class="ln"><span>Viaje de cliente actual</span><b>2%</b></div><div class="ln"><span>Viaje de cliente nuevo</span><b>6%</b></div><div class="ln"><span>Retorno llenado</span><b>8%</b></div><div class="ln"><span>Mínimo por viaje</span><b>$15.000</b></div></div></div></div>`}
},
/* ---------- Gerencia ---------- */
gerencia:{
 resumen(){const add=ix('pagado')?T().price:0,mg=add*.06,base=[182,196,188,214,231];const cur=(248e6+add)/1e6;
  return `<h1>Resumen de la operación</h1><p class="sub">El negocio completo en una pantalla.</p><div class="kp"><div class="k"><small>Facturado del mes</small><b>$${Math.round(cur)} M</b></div><div class="k"><small>Margen</small><b>$${Math.round(31+mg/1e6)} M</b></div><div class="k"><small>Retornos llenos</small><b>${S.ret?8:7}</b></div><div class="k"><small>Pagos a tiempo</small><b class="ok">100%</b></div></div>
  <div class="g2"><div class="card"><h2>Facturación <span>Millones por mes</span></h2><div class="bars">${['Jun','Jul','Ago','Sep','Oct'].map((m,i)=>`<div><b>${base[i]}</b><i style="height:${base[i]/3.2}px"></i><small>${m}</small></div>`).join('')}<div class="now"><b>${Math.round(cur)}</b><i style="height:${cur/3.2}px"></i><small>Nov</small></div></div></div>
  <div class="stack"><div class="card"><h2>Lo que necesita atención</h2><div class="stack" style="gap:6px"><div class="ln"><span>SKL 055 gasta 18% más ACPM</span><b class="warn">Revisar</b></div><div class="ln"><span>SOAT vencido en NHR 204</span><b class="crit">Bloqueado</b></div><div class="ln"><span>Factura vencida 9 días</span><b class="warn">Cobrar</b></div></div></div>${add?`<div class="note ok">ST-${S.id} cerrado: ${money(add)} facturados y ${money(mg)} de margen.</div>`:''}</div></div>`},
 utilidad(){const rows=[['XKT 118','Propio',9,58.2,36.1],['TSM 219','Propio',8,49.6,33.9],['WDN 731','Aliado',11,61.4,53.8],['SKL 055','Propio',6,34.8,29.3]];if(ix('pagado'))rows.unshift([T().v.p,'Aliado',1,T().price/1e6,T().price*.94/1e6,1]);
  return `<h1>Utilidad por carro</h1><p class="sub">Cuánto deja cada vehículo, después de ACPM, peajes, conductor y mantenimiento.</p><div class="card tw"><table><thead><tr><th>Vehículo</th><th>Vínculo</th><th class="r">Viajes</th><th class="r">Facturado</th><th class="r">Costos</th><th class="r">Utilidad</th><th class="r">Margen</th></tr></thead><tbody>${rows.map(r=>{const u=r[3]-r[4],m=u/r[3]*100;return`<tr class="${r[5]?'me':''}"><td>${r[0]}</td><td>${r[1]}</td><td class="r">${r[2]}</td><td class="r">$${r[3].toFixed(1).replace('.',',')} M</td><td class="r">$${r[4].toFixed(1).replace('.',',')} M</td><td class="r"><b>$${u.toFixed(1).replace('.',',')} M</b></td><td class="r ${m<15?'warn':'ok'}">${Math.round(m)}%</td></tr>`}).join('')}</tbody></table></div>`},
 legal(){const c=(t,d,s)=>`<div class="card"><h2>${t} <span class="st ok">${s}</span></h2><p class="sub" style="margin:0">${d}</p></div>`;return `<h1>Cumplimiento legal</h1><p class="sub">Decreto 1017 de 2025, vigilado automáticamente.</p><div class="g2">${c('Costo mínimo','Ningún viaje se pacta por debajo del costo mínimo de la ruta.','0 infracciones')}${c('Plazo de pago','El motor de pagos avisa antes de que venza cada flete.','100% a tiempo')}${c('Tiempos logísticos','Llegada, cargue y salida registrados por GPS.','Registrados')}${c('Manifiesto y cumplido','Emitidos por la transportadora habilitada, con foto, GPS y firma.','Con soporte')}</div><p></p><div class="note info">Las reglas se validan con el asesor jurídico antes del lanzamiento.</div>`}
}};
const ORDER=['none','reservado','ofertado','aceptado','ruta','entrega','cumplido','pagado'];
function ix(st){const cur=S.stage==='alerta'?'ruta':S.stage;return ORDER.indexOf(cur)>=ORDER.indexOf(st)}
const stageTxt=()=>({aceptado:'Por cargar',ruta:'En ruta',alerta:'Alerta',entrega:'En destino',cumplido:'Entregado'}[S.stage]||'Asignado');
function behind(){
  if(S.stage==='ofertado')return 'Despacho le envió la oferta porque está cerca, tiene buena calificación y sus documentos están al día.';
  if(S.stage==='alerta')return 'La alerta llegó a todos los conductores cercanos, a la torre de control y al cliente.';
  if(active())return 'Despacho ve su ubicación y el cliente sigue la carga sin llamar.';
  if(S.stage==='entrega')return 'Con foto, GPS y firma se puede facturar el mismo día y pagarle el saldo.';
  if(ix('pagado'))return 'Finanzas pagó el saldo y Gerencia ya ve la utilidad del viaje.';

function bindPanic(){const b=$('pan'),bar=$('pbr');if(!b)return;let raf=0,t0=0;const stop=()=>{cancelAnimationFrame(raf);bar.style.transform='scaleX(0)'};const h=t=>{const p=Math.min(1,(t-t0)/2000);bar.style.transform=`scaleX(${p})`;if(p>=1){stop();A.panico();return}raf=requestAnimationFrame(h)};const go=e=>{e.preventDefault();t0=performance.now();raf=requestAnimationFrame(h)};b.addEventListener('pointerdown',go);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,stop));b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)go(e)});b.addEventListener('keyup',stop)}

};
function arrive(){if(S.stage!=='ruta')return;S.run=false;S.stage='entrega';S.ph='inicio';log('conductor',`Llegó a ${S.d}.`);bump('conductor');render()}

const STEPS=[

 {r:'despacho',v:'asignar',t:'Despacho elige al conductor',d:'Solo aparecen vehículos con documentos al día.',x:'Enviar oferta',done:()=>ix('ofertado'),a:'ofertar'},
 {r:'conductor',v:'app',t:'La oferta llega al celular',d:'El conductor sabe cuánto gana antes de aceptar.',x:'Aceptar viaje',done:()=>ix('aceptado'),a:'aceptar'},

A.auto=()=>{S.pf={f:true,s:true};A.cumplir()};

function next(){const i=STEPS.findIndex(s=>!s.done());if(i<0)return;const s=STEPS[i];if(s.wait&&s.wait())return;const here=S.role===s.r&&S.view[s.r]===s.v;if(!here){go(s.r,s.v);return}if(s.go2&&!(S.role===s.go2[0])){go(s.go2[0],s.go2[1])}A[s.a]()}
function guide(){
  const i=STEPS.findIndex(s=>!s.done()),n=STEPS.length;

  $('ctx').innerHTML=`<div class="chip">${ic(R.i)}Entorno ${R.n}</div><span>${R.who}</span><span>· ${R.dev}</span><div class="sim">Demo con datos simulados</div>`;

}

  ['o','d'].forEach(k=>{const s=$('f'+k);Object.keys(CITY).sort().forEach(c=>{if(c!==(k==='o'?S.d:S.o))s.add(new Option(c,c))});s.value=S[k];s.onchange=()=>{S[k]=s.value;S['a'+k]='';render()};const a=$('a'+k);a.oninput=()=>{S['a'+k]=a.value}});
