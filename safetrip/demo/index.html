<style>
/* Un solo sistema, cinco entornos. Arriba se elige el rol; a la derecha se ve cómo se conectan. */
:root{
  --night:#0a111c;--panel:#101a29;--raise:#172435;--raise2:#1e2d42;--line:#25344a;
  --ink:#edf2f8;--mut:#93a4bb;--accent:#3d7bff;
  --ok:#35c98d;--warn:#f5b93a;--crit:#ff5a5f;
  --display:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --role:#3d7bff;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:500 14px/1.45 var(--body);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;min-height:680px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:58px 44px minmax(0,1fr) 64px}

/* Barra superior y roles */
.top{display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand svg{height:30px;width:auto;display:block}
.roles{display:flex;gap:4px;margin:0 auto;background:var(--night);padding:4px;border-radius:12px}
.rb{position:relative;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut);transition:background .15s,color .15s}
.rb:hover{color:var(--ink)}
.rb[aria-selected=true]{background:var(--rc);color:#06101f}
.rb .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font:800 10px/17px var(--body);text-align:center;padding:0 4px;animation:pop .35s}
@keyframes pop{from{transform:scale(0)}}
.op{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
.op .plate{background:#fff;border-radius:6px;padding:3px 7px;display:flex}
.op img{height:22px;width:auto;display:block}

/* Contexto del entorno */
.ctx{display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--role) 13%,var(--night));border-bottom:1px solid var(--line);font-size:13px}
.ctx .chip{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--role);font-family:var(--display);font-size:14px}
.ctx span{color:var(--mut)}
.ctx .sim{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--warn);white-space:nowrap}

/* Escenario */
.stage{display:grid;grid-template-columns:196px minmax(0,1fr) 262px;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.side h2{font:600 11px var(--body);color:var(--mut);margin:4px 8px 6px;letter-spacing:.04em}
.nv{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mut);text-align:left;width:100%}
.nv:hover{background:var(--raise);color:var(--ink)}
.nv[aria-current=page]{background:color-mix(in srgb,var(--role) 20%,transparent);color:var(--ink)}
.nv[aria-current=page] svg{color:var(--role)}
.nv em{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--crit);border-radius:8px;padding:0 6px}
.side .mod{margin-top:auto;font-size:11.5px;color:var(--mut);padding:8px;border-top:1px solid var(--line)}
.main{padding:16px 18px;overflow:auto;min-width:0}
h1{font:800 21px/1.15 var(--display);margin:0;text-wrap:balance}
.sub{margin:3px 0 14px;color:var(--mut);font-size:13.5px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g73{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.g37{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.k small{display:block;color:var(--mut);font-size:11.5px;font-weight:600}
.k b{font:800 22px/1.2 var(--display)}
.k i{font-style:normal;font-size:11.5px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;min-width:0}
.card h2{font:800 14.5px var(--display);margin:0 0 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{font:600 12px var(--body);color:var(--mut)}
.stack{display:grid;gap:12px;align-content:start}
label,.lab{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:4px}
select,.txt{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.txt:focus{border-color:var(--role)}
.seg{display:grid;gap:5px}.seg.v{grid-template-columns:repeat(4,1fr)}.seg.k3{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;font-weight:600;font-size:12.5px}
.opt small{display:block;color:var(--mut);font-size:11px;font-weight:500}
.opt:hover{border-color:#3b5170}
.opt[aria-pressed=true]{border-color:var(--role);background:color-mix(in srgb,var(--role) 16%,transparent)}
.big{font:900 34px/1.05 var(--display)}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)}
.ln b{color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 2px}
.note{border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600}
.note.ok{background:rgba(53,201,141,.12);color:#7fe3b8}.note.bad{background:rgba(255,90,95,.14);color:#ffa3a6}.note.warn{background:rgba(245,185,58,.12);color:var(--warn)}.note.info{background:rgba(61,123,255,.14);color:#a8c4ff}
.btn{background:var(--accent);color:#fff;border-radius:9px;padding:10px 14px;font-weight:700;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn[disabled]{background:var(--raise);color:var(--mut);cursor:not-allowed;filter:none}
.btn.full{width:100%}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.ghost{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-weight:700;background:var(--raise)}
.ghost:hover{border-color:#3b5170}
.ghost.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--mut);font-weight:700;padding:5px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(37,52,74,.55)}
tr:last-child td{border-bottom:0}
tr.me td{background:color-mix(in srgb,var(--role) 12%,transparent)}
td.r,th.r{text-align:right}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.mut{color:var(--mut)}.acc{color:#8fb2ff}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 11px 22px;color:var(--mut);font-size:13px}
.tl li::before{content:'';position:absolute;left:3px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl li::after{content:'';position:absolute;left:7.5px;top:15px;bottom:-3px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.d{color:var(--ink)}.tl li.d::before{background:var(--ok)}
.tl li.n{color:var(--ink);font-weight:700}.tl li.n::before{background:var(--role);box-shadow:0 0 0 4px color-mix(in srgb,var(--role) 28%,transparent)}
.bar{height:6px;background:var(--raise);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.empty{color:var(--mut);text-align:center;padding:22px 10px;font-size:13.5px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:16px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars i{display:block;width:100%;max-width:44px;background:var(--raise2);border-radius:5px 5px 0 0}
.bars .now i{background:var(--role)}
.bars b{font-size:11.5px;font-weight:700}.bars small{font-size:11px;color:var(--mut)}

/* Mapa */
.mapbox{position:relative;background:#0c1524;border:1px solid var(--line);border-radius:11px;overflow:hidden}
svg.map{display:block;width:100%;height:100%}
.colombia{fill:#142033;stroke:#2c3f5c;stroke-width:1.2}
.edge{fill:none;stroke-linecap:round;stroke-width:2.2;stroke-opacity:.5}
.routeb{fill:none;stroke:var(--accent);stroke-width:7;stroke-opacity:.32;stroke-linecap:round}
.routed{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.cn{fill:#b9c6d8;font:600 12px var(--body);paint-order:stroke;stroke:#0a111c;stroke-width:3px}
.cn.e{fill:#fff;font-weight:700}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.9s ease-out infinite}
@keyframes pl{from{transform:scale(.5);opacity:.8}to{transform:scale(2.6);opacity:0}}
.lg{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;font-size:11px;color:var(--mut);background:rgba(16,26,41,.9);border-radius:7px;padding:4px 8px}
.lg i{display:inline-block;width:13px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* Conductor */
.drv{display:grid;grid-template-columns:minmax(0,1fr) 288px minmax(0,1fr);gap:16px;align-items:center;min-height:100%}
.phone{width:288px;height:578px;max-height:100%;background:#05090f;border:7px solid #1e2a3b;border-radius:34px;display:flex;flex-direction:column;overflow:hidden;position:relative;justify-self:center}
.pstat{display:flex;justify-content:space-between;padding:8px 18px 3px;font-size:11px;font-weight:700;color:var(--mut)}
.pbody{flex:1;min-height:0;padding:8px 13px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.pbody.red{background:#3a0d13}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1a2636;background:#0a111c}
.ptabs button{padding:7px 2px 8px;font-size:10.5px;font-weight:700;color:var(--mut);display:grid;justify-items:center;gap:2px;position:relative}
.ptabs button[aria-current=page]{color:var(--role)}
.ptabs em{position:absolute;top:3px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
.ph{font:800 19px/1.15 var(--display);margin:0}.ps{color:var(--mut);font-size:12.5px;margin:0}
.pc{background:#101a28;border-radius:11px;padding:9px 12px}
.pc small{display:block;font-size:11px;color:var(--mut);font-weight:600}.pc b{font:800 15px/1.25 var(--display)}
.pay{font:900 26px/1.1 var(--display);color:var(--ok)}
.pb{border-radius:11px;padding:11px;font-weight:700;width:100%}
.pb.go{background:var(--accent);color:#fff}.pb.no{background:#101a28}.pb.ok{background:var(--ok);color:#07241a}.pb.white{background:#fff;color:#3a0d13}
.sp{margin-top:auto;display:grid;gap:7px}
.panic{position:relative;overflow:hidden;background:var(--crit);color:#fff;border-radius:11px;padding:12px;font-weight:800;width:100%;touch-action:none;user-select:none}
.panic i{position:absolute;inset:0;background:rgba(0,0,0,.3);transform:scaleX(0);transform-origin:left}.panic span{position:relative}
.chk{display:flex;justify-content:space-between;align-items:center;background:#101a28;border-radius:11px;padding:10px 12px;font-weight:600;width:100%;text-align:left}
.chk em{font-style:normal;font-size:12px;color:var(--mut)}.chk.d em{color:var(--ok);font-weight:700}
.ring{animation:rg .6s ease-in-out 3}@keyframes rg{25%{transform:rotate(-1.3deg)}75%{transform:rotate(1.3deg)}}
.exp h2{font:800 16px var(--display);margin:0 0 6px}.exp p{color:var(--mut);margin:0 0 10px;font-size:13.5px}
.exp ul{margin:0;padding-left:16px;color:var(--mut);font-size:13px;display:grid;gap:4px}

/* Línea conectada */
.rail{background:var(--panel);border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;min-height:0}
.rail h2{font:800 14px var(--display);margin:0}
.rail p{margin:1px 0 9px;font-size:12px;color:var(--mut)}
.feed{display:grid;gap:7px;overflow-x:hidden;overflow-y:auto;align-content:start;flex:1;min-height:0}
.ev{border-left:3px solid var(--c);padding:1px 0 1px 8px;font-size:12.5px;line-height:1.3}
.ev.nw{animation:evn .4s}
@keyframes evn{from{opacity:0;transform:translateX(8px)}}
.ev b{display:block;font-size:11px;color:var(--c);font-weight:800}
.ev small{color:var(--mut);font-size:11px}

/* Guía */
.guide{display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-top:1px solid var(--line)}
.steps{display:flex;gap:4px;flex:none}
.steps span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 11px var(--display);background:var(--raise);color:var(--mut)}
.steps span.d{background:var(--ok);color:#07241a}.steps span.n{background:var(--accent);color:#fff}
.hint{font-weight:700;min-width:0;font-size:14px}.hint small{display:block;color:var(--mut);font-weight:500;font-size:12.5px}
.gact{margin-left:auto;display:flex;gap:8px;flex:none}

/* Capas */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov.on{display:flex}
.modal{background:#2a0f14;border:1px solid var(--crit);border-radius:13px;padding:20px;max-width:440px;width:100%}
.modal h2{font:800 19px var(--display);margin:0;color:#ffb3b5}.modal p{margin:3px 0 10px;color:#f0c9ca;font-size:13.5px}
.modal ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:5px;font-size:13.5px;color:#c9a0a2}
.modal li.d{color:#fff}.modal li.d::before{content:'✓ ';color:var(--ok)}.modal li:not(.d)::before{content:'· '}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#0a111c;font-weight:700;border-radius:10px;padding:10px 16px;display:none;z-index:8;max-width:calc(100vw - 32px);font-size:13.5px}
.toast.on{display:block}

/* Vista en vivo: tres pantallas, un solo viaje */
.app.islive{grid-template-rows:58px minmax(0,1fr) 64px}
.app.islive .ctx,.app.islive .stage{display:none}
.live{display:none;grid-template-columns:292px minmax(0,1fr) 292px;gap:14px;padding:10px 16px;min-height:0;background:radial-gradient(ellipse 70% 80% at 50% 40%,#101d33,#0a111c)}
.app.islive .live{display:grid}
.dcol,.tcol{display:flex;flex-direction:column;min-height:0;gap:6px}
.dlab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mut)}
.dlab b{font:800 14px var(--display)}
.lp{flex:1;min-height:0;background:#f5f7fb;color:#101827;border:7px solid #d9dfea;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.lphone{width:100%;height:auto;flex:1;min-height:0;max-height:none;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.lh{background:#128c7e;color:#fff;padding:10px 13px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
.lh i{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;color:#128c7e;font-weight:900;font-size:13px}
.lh small{display:block;font-weight:500;opacity:.85;font-size:11px}
.chat{flex:1;min-height:0;overflow:auto;background:#ece5dd;padding:10px;display:flex;flex-direction:column;gap:7px}
.mm{max-width:88%;padding:7px 10px;border-radius:9px;font-size:13px;line-height:1.35;background:#fff;align-self:flex-start;animation:evn .3s}
.mm.me{background:#dcf8c6;align-self:flex-end}
.mm b{font-weight:800}
.dotsy{display:inline-flex;gap:3px}.dotsy i{width:6px;height:6px;border-radius:50%;background:#7c8798;animation:bl 1s infinite}.dotsy i:nth-child(2){animation-delay:.15s}.dotsy i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.cmp{background:#f0f0f0;padding:8px;display:flex;gap:6px}.cmp button{flex:1;background:#128c7e;color:#fff;border-radius:18px;padding:9px;font-weight:700;font-size:13px}
.ca{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;padding:13px;overflow:auto}
.ca h3{font:800 20px/1.15 var(--display);margin:0;color:#0b1320}
.ca p{margin:0;color:#5a677a;font-size:13px}
.cc{background:#fff;border-radius:13px;padding:11px 13px;box-shadow:0 2px 8px rgba(16,24,39,.07)}
.cc small{display:block;color:#6b7788;font-size:11.5px;font-weight:600}.cc b{font:800 15px/1.25 var(--display);color:#0b1320}
.cc .eta{font:900 27px/1.1 var(--display);color:#1f5fe0}
.cst{display:flex;gap:4px}.cst i{flex:1;height:5px;border-radius:3px;background:#dbe2ee}.cst i.d{background:#1f5fe0}
.cw{background:#fff3d6;color:#7a5200;border-radius:11px;padding:9px 11px;font-size:12.5px;font-weight:600}
.cok{background:#dff6ea;color:#0d6b43;border-radius:11px;padding:9px 11px;font-size:12.5px;font-weight:600}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #dbe2ee;border-top-color:#1f5fe0;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.glwrap{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0c1524}
#gl{position:absolute;inset:0}
.tkp{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2}
.tkp div{background:rgba(10,17,28,.86);border:1px solid var(--line);border-radius:9px;padding:5px 10px}
.tkp small{display:block;font-size:10.5px;color:var(--mut);font-weight:600}.tkp b{font:800 16px var(--display)}
.glwrap .lg{display:none}
.tnote{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:grid;gap:6px;pointer-events:none}
.tn{background:rgba(10,17,28,.9);border:1px solid var(--line);border-left:3px solid var(--c,#37d0c8);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;animation:evn .35s}
.tn.bad{background:rgba(58,13,19,.94);border-color:var(--crit)}
.tmk{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #3d7bff;box-shadow:0 0 0 7px rgba(61,123,255,.3)}
.amk{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 6px rgba(255,90,95,.25);background:var(--crit)}.amk.w{background:var(--warn);box-shadow:0 0 0 6px rgba(245,185,58,.25)}
.askov{position:absolute;right:10px;top:10px;width:min(330px,calc(100% - 20px));z-index:3;display:none}

.pfl button{flex:none;border:1px solid #2a3a52;border-radius:16px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--pink);min-height:36px}
.pfl button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.prow{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.prow:last-child{border-bottom:0}
.prow span{color:var(--pmut)}.prow b{text-align:right}
.ckin{background:#1b2a1f;border:1.5px solid #35c98d;border-radius:13px;padding:11px 13px;display:grid;gap:6px}
.ckin b{font-size:15px}.ckin small{color:#9fe0c3;font-size:12.5px}
.ckin .pb{min-height:48px}
.ckin.late{background:#3a0d13;border-color:var(--crit)}.ckin.late small{color:#ffb3b5}
.wa-msg{background:#dcf8c6;color:#0b1320;border-radius:10px;padding:8px 10px;font-size:13px;align-self:flex-end;max-width:90%}
.wa-in{background:#fff;color:#0b1320;border-radius:10px;padding:8px 10px;font-size:13px;align-self:flex-start;max-width:90%}
.wa-wrap{flex:1;display:flex;flex-direction:column;gap:6px;background:#ece5dd;border-radius:12px;padding:10px;overflow:auto;min-height:120px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#101a28;border-radius:22px 22px 0 0;padding:14px 14px 16px;display:grid;gap:8px;box-shadow:0 -12px 30px rgba(0,0,0,.5);animation:up .25s;z-index:3;max-height:88%;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font:800 17px var(--display)}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:#2a3a52;margin:0 auto 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opts button{background:#172435;border-radius:11px;padding:11px 10px;text-align:left;font-weight:700;font-size:13.5px;min-height:56px;display:grid;gap:2px;color:#f3f6fb;border:1.5px solid transparent}
.opts button[aria-pressed=true]{border-color:var(--accent)}
.opts button small{color:#a7b6c9;font-size:11.5px;font-weight:500}
.docrow{display:flex;align-items:center;gap:10px;background:var(--pcard);border-radius:12px;padding:10px 12px;min-height:56px;width:100%;text-align:left}
.docrow b{display:block;font-size:14px;font-weight:700}.docrow small{display:block;color:var(--pmut);font-size:11.5px}
.docrow .stt{margin-left:auto;flex:none;font-size:12px;font-weight:800}
.docrow .mini{width:18px;height:18px;border-radius:50%;border:2.5px solid #2a3a52;border-top-color:var(--accent);animation:spn .9s linear infinite;flex:none}
.pstp{display:flex;gap:4px}.pstp i{flex:1;height:4px;border-radius:2px;background:#22304a}.pstp i.d{background:var(--accent)}
.bigok{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:8px auto 0;color:#07241a}
.bigok svg{width:32px;height:32px;stroke-width:2.6}
.sel-mini{display:flex;gap:6px;flex-wrap:wrap}
.sel-mini button{border:1px solid #2a3a52;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--pink);min-height:40px}
.sel-mini button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.home .hg .hc{min-height:112px}
.home .hc .dv{font-size:10.5px;font-weight:800;color:#7aa4ff;letter-spacing:.04em;text-transform:uppercase}
.home .hrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.home .hrow .btn{margin-top:0}
.home .hrow .ghost{padding:12px 18px;font-size:14.5px;color:#edf2f8;background:#121e30;border-color:#2b3b52}
.home .hk{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px;color:#a9b8cc;font-size:12.5px}
.home .hk span{display:flex;align-items:center;gap:6px}.home .hk svg{color:#35c98d}
.tbar .srch input{background:none;border:0;outline:0;color:var(--ink);width:100%;font-size:13px}
.sig{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--pmut)}
.sig i{display:inline-block;width:3px;background:currentColor;border-radius:1px}
@media(max-width:1180px){.vehs{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.home .hg{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.vehs{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}.home .hg{grid-template-columns:1fr 1fr}.home .hg .hc{min-height:0}.phone{width:min(300px,calc(100vw - 24px))}.wn .btn{min-width:0;flex:1}.wn{gap:8px}.cbl{max-height:240px}}
.dock .dkt{display:none;place-items:center;width:46px;height:46px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;gap:4px}
.dock .dkc{display:contents}
/* Móvil real: el celular ocupa toda la pantalla, sin marco */
@media(max-width:520px){
  .app[data-role=conductor] .main,.app[data-view=app] .main{padding:0;display:block;background:var(--night);place-items:stretch}
  .app[data-role=conductor] .drv,.app[data-view=app] .drv{width:100%}
  .app[data-view=app] .side,.app[data-view=app] .tbar{display:none}
  .app[data-view=app] .stage,.app[data-role=conductor] .stage{grid-template-columns:minmax(0,1fr)}
  .drv{height:100vh;height:100dvh}
  .app[data-role=conductor] .phone,.app[data-view=app] .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
  .phone .pstat{padding-top:max(8px,env(safe-area-inset-top,8px))}
  .phone .ptabs{padding-bottom:env(safe-area-inset-bottom,0px)}
  .phone.tabs .psheet{bottom:calc(56px + env(safe-area-inset-bottom,0px))}
  .phone.tabs .fabs{bottom:calc(var(--peekh) + 68px + env(safe-area-inset-bottom,0px))}
  .pbar{top:max(34px,calc(env(safe-area-inset-top,8px) + 28px))}
  .pfull{padding-top:max(30px,calc(env(safe-area-inset-top,8px) + 24px))}
  .pfull.glass{padding-top:max(26px,calc(env(safe-area-inset-top,8px) + 20px))}
  .main{padding-bottom:0}
  .dock{left:auto;right:10px;bottom:calc(68px + env(safe-area-inset-bottom,0px));transform:none;padding:0;border-radius:24px;flex-wrap:nowrap;max-width:calc(100vw - 20px);gap:0}
  .dock .dkt{display:grid}
  .dock .dkc{display:none}
  .dock.open{border-radius:14px}
  .dock.open .dkc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px 10px}
  .dock.open .dkt{width:100%;height:36px;border-radius:0;justify-content:flex-end}
  .app:not([data-role=conductor]):not([data-view=app]) .dock{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  body:has(.phone [data-a="aceptar"]) .dock:not(.open){bottom:auto;top:calc(8px + env(safe-area-inset-top,0px))}
}

</style>
