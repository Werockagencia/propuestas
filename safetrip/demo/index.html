<style>
/* Mundo único: torre de control nocturna. Mapa al centro, operación a la izquierda, conductor a la derecha. */
:root{
  --night:#0b121c;--panel:#111b29;--raise:#182436;--line:#25344a;
  --ink:#edf2f8;--mut:#93a4bb;--accent:#3d7bff;--accent-ink:#ffffff;
  --ok:#35c98d;--warn:#f5b93a;--crit:#ff5a5f;
  --display:Archivo,"Arial Narrow",system-ui,sans-serif;--body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:500 14px/1.45 var(--body);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;min-height:680px;display:grid;grid-template-rows:60px minmax(0,1fr) 62px}

/* Barra superior */
.top{display:flex;align-items:center;gap:22px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{height:32px;width:auto;display:block}
.kpis{display:flex;gap:26px;margin-left:12px}
.kpi small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.kpi b{font:800 17px/1.1 var(--display)}
.kpi.alert b{color:var(--crit)}
.right{margin-left:auto;display:flex;align-items:center;gap:12px}
.sim{font-size:11.5px;font-weight:700;color:var(--warn);border:1px solid rgba(245,185,58,.4);border-radius:999px;padding:4px 10px;white-space:nowrap}
.op{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);font-weight:600}
.op span.plate{background:#fff;border-radius:6px;padding:3px 7px;display:flex}
.op img{height:24px;width:auto;display:block}

/* Escenario */
.stage{display:grid;grid-template-columns:348px minmax(0,1fr) 312px;min-height:0}
.left{border-right:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mapwrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
.phonewrap{border-left:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;padding:12px;min-height:0}
h1{font:800 20px/1.15 var(--display);margin:0;text-wrap:balance}
.lead{margin:2px 0 0;color:var(--mut);font-size:13px}
label,.lab{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:4px}
select{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;gap:5px}
.seg.v{grid-template-columns:1fr 1fr}
.seg.k{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;font-weight:600;font-size:12.5px;transition:border-color .15s,background .15s}
.opt small{display:block;color:var(--mut);font-size:11px;font-weight:500}
.opt:hover{border-color:#3a4f6e}
.opt[aria-pressed=true]{border-color:var(--accent);background:rgba(61,123,255,.14)}
.pricebox{background:var(--raise);border-radius:10px;padding:12px}
.big{font:900 33px/1.05 var(--display);letter-spacing:-.01em}
.line{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut)}
.line b{color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 2px}
.note{border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600}
.note.ok{background:rgba(53,201,141,.12);color:#7fe3b8}
.note.bad{background:rgba(255,90,95,.14);color:#ffa3a6}
.note.warn{background:rgba(245,185,58,.12);color:var(--warn)}
.cta{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:11px 14px;font-weight:700;width:100%;transition:filter .15s}
.cta:hover{filter:brightness(1.1)}
.cta[disabled]{background:var(--raise);color:var(--mut);cursor:not-allowed;filter:none}
.ghost{border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-weight:700;color:var(--ink);background:var(--raise)}
.ghost:hover{border-color:#3a4f6e}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{position:relative;padding:0 0 13px 22px;color:var(--mut);font-size:13px}
.tl li::before{content:'';position:absolute;left:3px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl li::after{content:'';position:absolute;left:7.5px;top:15px;bottom:-3px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--ink)}
.tl li.done::before{background:var(--ok)}
.tl li.now{color:var(--ink);font-weight:700}
.tl li.now::before{background:var(--accent);box-shadow:0 0 0 4px rgba(61,123,255,.25)}
.bar{height:6px;background:var(--raise);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--raise);border-radius:9px;padding:9px 11px}
.tile small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.tile b{font:800 17px/1.2 var(--display)}
.rows{display:grid;gap:7px}
.rows .line{font-size:13.5px}
.rows .tot{border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.rows .tot b{color:var(--ok);font:800 18px var(--display)}

/* Mapa */
svg.map{height:100%;max-width:100%;display:block}
.colombia{fill:#142033;stroke:#2c3f5c;stroke-width:1.2}
.edge{fill:none;stroke-linecap:round;stroke-width:2.2;stroke-opacity:.8}
.dim .edge{stroke-opacity:.5}
.route{fill:none;stroke:var(--accent);stroke-width:7;stroke-opacity:.35;stroke-linecap:round}
.routedone{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.city{fill:var(--ink)}
.cname{fill:#b9c6d8;font:600 12px var(--body);paint-order:stroke;stroke:#0b121c;stroke-width:3px}
.cname.end{fill:#fff;font-weight:700}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.9s ease-out infinite}
@keyframes pl{from{transform:scale(.5);opacity:.8}to{transform:scale(2.6);opacity:0}}
.mapcard{position:absolute;background:rgba(17,27,41,.92);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.feed{top:12px;right:12px;width:232px}
.feed h2{font:800 13px var(--display);margin:0 0 6px;display:flex;justify-content:space-between}
.feed h2 span{color:var(--mut);font:600 11.5px var(--body)}
.ai{border-left:3px solid var(--crit);padding:1px 0 1px 8px;margin-top:7px;font-size:12px;line-height:1.3}
.ai.w{border-left-color:var(--warn)}
.ai.g{border-left-color:var(--ok);color:var(--mut)}
.ai b{display:block;font-weight:700}
.ai small{color:var(--mut);font-size:11px}
.legend{left:12px;bottom:12px;display:flex;gap:12px;font-size:11.5px;color:var(--mut);padding:7px 11px}
.legend i{display:inline-block;width:15px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.incident{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(430px,calc(100% - 28px));background:#2a0f14;border:1px solid var(--crit);border-radius:12px;padding:13px 15px;display:none;z-index:3}
.incident.on{display:block;animation:sh .4s}
@keyframes sh{0%{transform:translate(-50%,-8px);opacity:0}}
.incident h2{font:800 16px var(--display);margin:0;color:#ffb3b5}
.incident p{margin:2px 0 8px;font-size:12.5px;color:#f0c9ca}
.incident ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:3px;font-size:12.5px;color:#c9a0a2}
.incident li.d{color:#fff}
.incident li.d::before{content:'✓ ';color:var(--ok)}
.incident li:not(.d)::before{content:'· '}

/* Celular */
.phone{width:278px;height:min(100%,590px);background:#05090f;border:7px solid #1e2a3b;border-radius:34px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.pstat{display:flex;justify-content:space-between;padding:8px 18px 3px;font-size:11px;font-weight:700;color:var(--mut)}
.pscreen{flex:1;min-height:0;padding:8px 14px 14px;display:flex;flex-direction:column;gap:9px;overflow:auto}
.pscreen.red{background:#3a0d13}
.ph{font:800 19px/1.15 var(--display);margin:0}
.ps{color:var(--mut);font-size:12.5px;margin:0}
.pc{background:#101a28;border-radius:11px;padding:10px 12px}
.pc small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.pc b{font:800 16px/1.25 var(--display)}
.pay{font:900 27px/1.1 var(--display);color:var(--ok)}
.pbtn{border-radius:11px;padding:12px;font-weight:700;width:100%}
.pbtn.go{background:var(--accent);color:#fff}
.pbtn.no{background:#101a28;color:var(--ink)}
.pbtn.ok{background:var(--ok);color:#07241a}
.pbtn.white{background:#fff;color:#3a0d13}
.spacer{margin-top:auto;display:grid;gap:8px}
.panic{position:relative;overflow:hidden;background:var(--crit);color:#fff;border-radius:11px;padding:13px;font-weight:800;width:100%;touch-action:none;user-select:none}
.panic i{position:absolute;inset:0;background:rgba(0,0,0,.3);transform:scaleX(0);transform-origin:left}
.panic span{position:relative}
.chk{display:flex;justify-content:space-between;align-items:center;background:#101a28;border-radius:11px;padding:11px 12px;font-weight:600;width:100%;text-align:left}
.chk em{font-style:normal;font-size:12px;color:var(--mut)}
.chk.d em{color:var(--ok);font-weight:700}
.ring{animation:rg .6s ease-in-out 3}
@keyframes rg{25%{transform:rotate(-1.4deg)}75%{transform:rotate(1.4deg)}}

/* Guía */
.guide{display:flex;align-items:center;gap:16px;padding:0 18px;border-top:1px solid var(--line);background:var(--panel)}
.steps{display:flex;gap:5px;flex:none}
.steps span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--display);background:var(--raise);color:var(--mut)}
.steps span.d{background:var(--ok);color:#07241a}
.steps span.n{background:var(--accent);color:#fff}
.hint{font-weight:600;min-width:0}
.hint small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.gact{margin-left:auto;display:flex;gap:8px;flex:none}
.gact .cta{width:auto;padding:9px 14px}
.gact .ghost{padding:8px 12px}

@media(max-width:1180px){
  html,body{height:auto}
  .app{height:auto;grid-template-rows:auto auto auto}
  .top{flex-wrap:wrap;padding:10px 16px;gap:12px}.kpis{order:3;width:100%;margin:0;justify-content:space-between;gap:10px}
  .stage{grid-template-columns:1fr}
  .left,.phonewrap{border:0}.mapwrap{height:min(120vw,620px)}.phone{height:590px}
  .guide{flex-wrap:wrap;padding:10px 16px}.gact{margin-left:0}
  .feed{width:190px}
}
@media(prefers-reduced-motion:reduce){.pulse,.ring,.incident.on{animation:none}}
</style>
</head>

<script>
(function(){
const $=id=>document.getElementById(id);
const CITY={'Santa Marta':[11.24,-74.2],'Barranquilla':[10.98,-74.8],'Cartagena':[10.4,-75.51],'Cúcuta':[7.89,-72.5],'Bucaramanga':[7.12,-73.12],'Medellín':[6.25,-75.56],'Pereira':[4.81,-75.69],'Ibagué':[4.44,-75.23],'Bogotá':[4.71,-74.07],'Villavicencio':[4.14,-73.63],'Buenaventura':[3.88,-77.03],'Cali':[3.45,-76.53],'Neiva':[2.93,-75.28],'Pasto':[1.21,-77.28]};
// ciudad, ciudad, km aproximados, riesgo simulado (0 bajo, 1 medio, 2 alto)
const E=[['Barranquilla','Cartagena',120,0],['Barranquilla','Santa Marta',95,0],['Cartagena','Medellín',640,1],['Santa Marta','Bucaramanga',590,2],['Barranquilla','Bucaramanga',590,1],['Bucaramanga','Cúcuta',195,2],['Bucaramanga','Bogotá',400,1],['Medellín','Bogotá',415,1],['Medellín','Pereira',215,0],['Pereira','Cali',215,0],['Pereira','Ibagué',170,1],['Ibagué','Bogotá',200,0],['Ibagué','Cali',265,1],['Bogotá','Villavicencio',120,1],['Cali','Buenaventura',125,2],['Ibagué','Neiva',205,0],['Bogotá','Neiva',310,0],['Cali','Pasto',390,2]];
const V=[{n:'Camión pequeño',d:'hasta 3,5 t',r:1400,s:62,p:'NHR 204'},{n:'Sencillo',d:'hasta 9 t',r:2100,s:58,p:'TSM 219'},{n:'Doble troque',d:'15 a 18 t',r:3200,s:55,p:'WDN 731'},{n:'Tractomula',d:'hasta 34 t',r:4700,s:52,p:'XKT 482'}];
const K=[{n:'Seca',f:1},{n:'Refrigerada',f:1.22},{n:'Sobredim.',f:1.35}];
const RN=['Bajo','Medio','Alto'],RC=['var(--ok)','var(--warn)','var(--crit)'];
const STEPS=6;
const money=n=>'$'+(Math.round(n/1000)*1000).toLocaleString('es-CO');
const P=c=>[(CITY[c][1]+80)*40,(13-CITY[c][0])*40];
const key=(a,b)=>[a,b].sort().join('|');
const edge=(a,b)=>E.find(e=>key(e[0],e[1])===key(a,b));
const seed0=()=>[{t:'Bloqueo',w:'Bucaramanga – Cúcuta',ago:'hace 25 min',lvl:'w',e:E[5]},{t:'Retén sospechoso',w:'Cali – Buenaventura',ago:'hace 12 min',lvl:'',e:E[14]},{t:'Robo por confirmar',w:'Cali – Pasto',ago:'hace 3 min',lvl:'w',e:E[17]}];
let S;
function reset(){
  S={stage:'quote',o:'Bogotá',d:'Barranquilla',v:3,k:1,pct:100,alerts:seed0(),id:1047,prog:0,run:false,price:0,r:null,last:0,alertUsed:false,panicUsed:false,proof:{f:false,g:true,s:false},stopped:false};
  $('inc').classList.remove('on');render();
}
function route(a,b){
  const d={},pv={},todo=new Set(Object.keys(CITY));todo.forEach(c=>d[c]=Infinity);d[a]=0;
  while(todo.size){let u=null;todo.forEach(c=>{if(u===null||d[c]<d[u])u=c});todo.delete(u);if(u===b)break;
    E.forEach(e=>{const n=e[0]===u?e[1]:e[1]===u?e[0]:null;if(n&&todo.has(n)&&d[u]+e[2]<d[n]){d[n]=d[u]+e[2];pv[n]=u}})}
  const p=[b];while(p[0]!==a)p.unshift(pv[p[0]]);return{path:p,km:d[b]};
}
function ctrl(a,b){const[s,t]=[a,b].sort(),A=P(s),B=P(t),dx=B[0]-A[0],dy=B[1]-A[1],sg=(s.length+t.length)%2?1:-1;return[(A[0]+B[0])/2-dy*.07*sg,(A[1]+B[1])/2+dx*.07*sg]}
const seg=(a,b)=>{const c=ctrl(a,b),q=P(b);return`Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${q[0].toFixed(1)} ${q[1].toFixed(1)}`};
const pathD=p=>{const s=P(p[0]);let d=`M${s[0].toFixed(1)} ${s[1].toFixed(1)}`;for(let i=1;i<p.length;i++)d+=seg(p[i-1],p[i]);return d};
const mid=e=>{const a=P(e[0]),b=P(e[1]),c=ctrl(e[0],e[1]);return[(a[0]+2*c[0]+b[0])/4,(a[1]+2*c[1]+b[1])/4]};
function quote(){
  const r=route(S.o,S.d),v=V[S.v],k=K[S.k],min=r.km*v.r*k.f,fl=min*1.18;
  const risk=Math.max(...r.path.slice(1).map((c,i)=>edge(r.path[i],c)[3]));
  return{r,v,k,min,fl,price:fl*S.pct/100,cost:min*.9,risk,h:Math.round(r.km/v.s)};
}
function drawMap(){
  const q=S.r||quote().r;
  $('gE').setAttribute('class','dim');
  $('gE').innerHTML=E.map(e=>`<path class="edge" stroke="${RC[e[3]]}" d="${pathD([e[0],e[1]])}"/>`).join('');
  $('gR').innerHTML=`<path class="route" id="rt" d="${pathD(q.path)}"/><path class="routedone" id="rd" d="${pathD(q.path)}"/>`;
  const L=['Buenaventura','Pasto','Cartagena','Pereira','Medellín','Cali'];
  $('gC').innerHTML=Object.keys(CITY).map(c=>{const p=P(c),end=c===q.path[0]||c===q.path[q.path.length-1],l=L.includes(c);
    return`<circle class="city" cx="${p[0]}" cy="${p[1]}" r="${end?5.5:3.2}"/><text class="cname${end?' end':''}" x="${p[0]+(l?-8:8)}" y="${p[1]+4}" text-anchor="${l?'end':'start'}">${c}</text>`}).join('');
  drawAlerts();progress();
}
function drawAlerts(){
  $('gA').innerHTML=S.alerts.filter(a=>a.lvl!=='g').map(a=>{const m=a.xy||mid(a.e),col=a.lvl==='w'?'var(--warn)':'var(--crit)';return`<circle class="pulse" cx="${m[0]}" cy="${m[1]}" r="11" fill="${col}"/><circle cx="${m[0]}" cy="${m[1]}" r="5" fill="${col}" stroke="#0b121c" stroke-width="2"/>`}).join('');
  const act=S.alerts.filter(a=>a.lvl!=='g').length;
  $('k3').textContent=act;$('fc').textContent=act+' activas';
  $('feed').innerHTML=S.alerts.slice(0,3).map(a=>`<div class="ai ${a.lvl}"><b>${a.t}</b>${a.w}<br><small>${a.ago}</small></div>`).join('');
}
function progress(){
  const rt=$('rt'),rd=$('rd');if(!rt)return;const len=rt.getTotalLength(),p=S.prog;
  rd.setAttribute('stroke-dasharray',`${len*p} ${len}`);
  if(S.stage==='quote'||S.stage==='offer'){$('gT').innerHTML='';return}
  const pt=rt.getPointAtLength(len*p);
  $('gT').innerHTML=`<circle class="pulse" cx="${pt.x}" cy="${pt.y}" r="11" fill="#3d7bff"/><circle cx="${pt.x}" cy="${pt.y}" r="7" fill="#fff" stroke="#3d7bff" stroke-width="3"/>${p<1?`<text class="cname end" x="${pt.x+12}" y="${pt.y-9}">${S.plate}</text>`:''}`;
}
// Flota de fondo para dar vida al mapa
const fleet=[[E[7],.2,1],[E[9],.6,-1],[E[2],.4,1],[E[11],.7,1],[E[16],.3,-1],[E[4],.55,1],[E[12],.15,-1]];
function drawFleet(t){
  $('gF').innerHTML=fleet.map(f=>{const u=(f[1]+f[2]*t/90000+10)%1,a=P(f[0][0]),b=P(f[0][1]),c=ctrl(f[0][0],f[0][1]),m=1-u,x=m*m*a[0]+2*m*u*c[0]+u*u*b[0],y=m*m*a[1]+2*m*u*c[1]+u*u*b[1];return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#8fb0ff"/>`}).join('');
}

function left(){
  const el=$('left');
  if(S.stage==='quote'){
    const q=quote(),bad=q.price<q.min,al=S.alerts.find(a=>a.lvl!=='g'&&q.r.path.includes(a.e[0])&&q.r.path.includes(a.e[1]));
    el.innerHTML=`<div><h1>Cotizar un viaje</h1><p class="lead">Precio al instante, sin bajar del costo mínimo.</p></div>
    <div class="two"><div><label for="o">Origen</label><select id="o"></select></div><div><label for="d">Destino</label><select id="d"></select></div></div>
    <div><span class="lab">Vehículo</span><div class="seg v">${V.map((x,i)=>`<button class="opt" data-v="${i}" aria-pressed="${i===S.v}">${x.n}<small>${x.d}</small></button>`).join('')}</div></div>
    <div><span class="lab">Carga</span><div class="seg k">${K.map((x,i)=>`<button class="opt" data-k="${i}" aria-pressed="${i===S.k}">${x.n}</button>`).join('')}</div></div>
    <div class="pricebox"><div class="line"><span>Flete sugerido</span><span>${q.r.km.toLocaleString('es-CO')} km · ${q.h} h · riesgo <b style="color:${RC[q.risk]}">${RN[q.risk]}</b></span></div>
    <div class="big" id="pv">${money(q.price)}</div>
    <input type="range" id="pr" min="70" max="125" step="1" value="${S.pct}" aria-label="Precio a pactar">
    <div class="line"><span>Costo mínimo <b id="mn">${money(q.min)}</b></span><span>Margen <b id="mg">${Math.round((q.price-q.cost)/q.price*100)}%</b></span></div></div>
    <div class="note ${bad?'bad':'ok'}" id="nt">${bad?'Bloqueado: queda por debajo del costo mínimo de la ruta.':'Precio dentro de la norma.'}</div>
    ${al?`<div class="note warn">Alerta en la ruta: ${al.t}, ${al.w}.</div>`:q.risk===2?'<div class="note warn">Ruta de riesgo alto: salida de día recomendada.</div>':''}
    <button class="cta" id="res" ${bad?'disabled':''}>Reservar por ${money(q.price)}</button>`;
    ['o','d'].forEach(id=>{const s=$(id);Object.keys(CITY).sort().forEach(c=>{if(c!==(id==='o'?S.d:S.o))s.add(new Option(c,c))});s.value=S[id];s.onchange=()=>{S[id]=s.value;S.r=null;render()}});
    el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.v=+b.dataset.v;render()});
    el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.k=+b.dataset.k;render()});
    $('pr').oninput=e=>{S.pct=+e.target.value;const q=quote(),bad=q.price<q.min;$('pv').textContent=money(q.price);$('mg').textContent=Math.round((q.price-q.cost)/q.price*100)+'%';const n=$('nt');n.className='note '+(bad?'bad':'ok');n.textContent=bad?'Bloqueado: queda por debajo del costo mínimo de la ruta.':'Precio dentro de la norma.';const b=$('res');b.disabled=bad;b.textContent='Reservar por '+money(q.price)};
    $('res').onclick=reserve;
    return;
  }
  const tl=[['Cotizado y reservado',1],['Conductor asignado',S.stage!=='offer'],['En ruta',S.stage==='arrive'||S.stage==='done'],['Cumplido digital',S.stage==='done'],['Pago al propietario',false]];
  const now=S.stage==='offer'?1:S.stage==='trip'?2:S.stage==='arrive'?3:4;
  const list=`<ul class="tl">${tl.map((x,i)=>`<li class="${i===now?'now':x[1]?'done':''}">${x[0]}</li>`).join('')}</ul>`;
  const head=`<div><h1>Viaje ST-${S.id}</h1><p class="lead">${S.o} → ${S.d} · ${V[S.v].n} · ${K[S.k].n}</p></div>`;
  if(S.stage==='offer'){el.innerHTML=head+`<div class="note ok">Oferta enviada a conductores calificados en la zona.</div>`+list;return}
  if(S.stage==='done'){
    const p=S.price,own=p*.88,fee=p*.02,marg=p-own-fee;
    el.innerHTML=head+`<div class="note ok">Cumplido recibido: listo para facturar hoy.</div><div class="pricebox rows"><div class="line"><span>Flete</span><b>${money(p)}</b></div><div class="line"><span>Pago al propietario</span><b>−${money(own)}</b></div><div class="line"><span>Flett (2%)</span><b>−${money(fee)}</b></div><div class="line tot"><span>Le queda a Safe Trip</span><b>${money(marg)}</b></div></div><div class="grid2"><div class="tile"><small>Tiempo total</small><b>${S.h} h</b></div><div class="tile"><small>Pago al conductor</small><b>48 h</b></div></div>`+list;
    return;
  }
  el.innerHTML=head+`<div class="grid2"><div class="tile"><small>Faltan</small><b id="tk">0 km</b></div><div class="tile"><small>Conductor</small><b>Jairo R.</b></div></div><div class="bar"><i id="tb"></i></div>`+list+`<div class="tile"><small>Flete pactado</small><b>${money(S.price)}</b></div>`;
  tick0();
}
function tick0(){const k=$('tk');if(k)k.textContent=Math.round(S.r.km*(1-S.prog)).toLocaleString('es-CO')+' km';const b=$('tb');if(b)b.style.width=(S.prog*100)+'%'}

function phone(){
  const el=$('ps');el.className='pscreen';
  const home=(sub)=>`<div><p class="ps">Buenos días</p><h2 class="ph">Hola, Jairo</h2></div><div class="pc"><small>Tu vehículo</small><b>${S.plate||'XKT 482'}</b><small style="color:var(--ok)">Documentos al día</small></div><div class="pc"><small>Tu zona</small><b>Sin alertas cerca</b></div><div class="pc"><small>Este mes</small><b>11 viajes · Nivel Plata</b></div><p class="ps" style="margin-top:auto">${sub}</p>`;
  if(S.stage==='quote'){el.innerHTML=home('Esperando ofertas de viaje.');return}
  if(S.stage==='offer'){
    const pay=S.price*.88;
    el.innerHTML=`<div><p class="ps">Nueva oferta</p><h2 class="ph">${S.o} → ${S.d}</h2></div><div class="pc"><small>Te pagan</small><div class="pay">${money(pay)}</div><small>Anticipo 50% al cargar · Saldo en 48 h</small></div><div class="pc"><small>Distancia y riesgo</small><b>${S.r.km.toLocaleString('es-CO')} km · ${RN[S.risk]}</b></div><div class="pc"><small>Carga</small><b>${K[S.k].n}</b></div><div class="spacer"><button class="pbtn go" id="acc">Aceptar viaje</button><button class="pbtn no" id="rej">Rechazar</button></div>`;
    $('phone').classList.remove('ring');void $('phone').offsetWidth;$('phone').classList.add('ring');
    $('acc').onclick=accept;$('rej').onclick=()=>{S.stage='quote';render()};return;
  }
  if(S.stage==='trip'&&S.stopped){
    el.innerHTML=`<div><p class="ps">Punto recomendado</p><h2 class="ph">Parado en zona segura</h2></div><div class="pc"><small>Estado de la alerta</small><b id="wait">Esperando confirmación de vía</b></div><p class="ps">La central sabe dónde estás y te avisa cuando puedas seguir.</p>`;return;
  }
  if(S.stage==='alert'){
    el.className='pscreen red';
    el.innerHTML=`<div><p class="ps" style="color:#ffb3b5">Alerta confirmada</p><h2 class="ph">Robo adelante</h2></div><div class="pc" style="background:#57121b"><small style="color:#ffc9cb">Corredor</small><b>${S.aw}</b><small style="color:#ffc9cb">A 38 km de ti · Hace 2 min</small></div><p class="ps" style="color:#ffd9da">2 conductores confirmaron el reporte.</p><div class="spacer"><button class="pbtn white" id="stop">Parar en punto recomendado</button><button class="pbtn no" style="background:#57121b" id="cont">Seguir con precaución</button></div>`;
    $('stop').onclick=stopTruck;$('cont').onclick=()=>{S.stage='trip';S.run=true;render()};return;
  }
  if(S.stage==='trip'){
    el.innerHTML=`<div><p class="ps">En ruta a ${S.d}</p><h2 class="ph" id="pk">0 km</h2></div><div class="pc"><small>Pago del viaje</small><div class="pay" style="font-size:22px">${money(S.price*.88)}</div></div><div class="pc"><small>Alertas en tu ruta</small><b>${S.alertUsed?'1 resuelta':'Ninguna'}</b></div><div class="spacer"><button class="panic" id="pan" aria-label="Botón de pánico: mantener dos segundos"><i id="pb"></i><span>Mantén para PÁNICO</span></button></div>`;
    bindPanic();tickP();return;
  }
  if(S.stage==='arrive'){
    const c=S.proof,ok=c.f&&c.s;
    el.innerHTML=`<div><p class="ps">Llegaste a ${S.d}</p><h2 class="ph">Cumplido digital</h2></div><button class="chk ${c.f?'d':''}" id="cf">Foto de la entrega <em>${c.f?'Lista':'Tomar'}</em></button><div class="chk d">Ubicación GPS <em>Lista</em></div><button class="chk ${c.s?'d':''}" id="cs">Firma del cliente <em>${c.s?'Lista':'Firmar'}</em></button><div class="spacer"><button class="pbtn ok" id="send" ${ok?'':'disabled style="opacity:.4"'}>Enviar cumplido</button></div>`;
    $('cf').onclick=()=>{S.proof.f=true;render()};$('cs').onclick=()=>{S.proof.s=true;render()};if(ok)$('send').onclick=()=>{S.stage='done';render()};return;
  }
  if(S.stage==='done'){
    el.innerHTML=`<div><p class="ps">Viaje ST-${S.id}</p><h2 class="ph">Entrega aprobada</h2></div><div class="pc"><small>Saldo programado</small><div class="pay">${money(S.price*.44)}</div><small>Llega en 48 horas</small></div><div class="pc"><small>Calificación</small><b>4,9 · Sube a Nivel Oro</b></div><p class="ps" style="margin-top:auto">Hay un retorno disponible desde ${S.d}.</p>`;
  }
}
function tickP(){const k=$('pk');if(k)k.textContent=Math.round(S.r.km*(1-S.prog)).toLocaleString('es-CO')+' km'}
function bindPanic(){
  const b=$('pan'),bar=$('pb');let raf=0,t0=0;
  const h=t=>{const p=Math.min(1,(t-t0)/2000);bar.style.transform=`scaleX(${p})`;if(p>=1){stop();panic();return}raf=requestAnimationFrame(h)};
  const go=e=>{e.preventDefault();t0=performance.now();raf=requestAnimationFrame(h)};
  const stop=()=>{cancelAnimationFrame(raf);bar.style.transform='scaleX(0)'};
  b.addEventListener('pointerdown',go);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,stop));
  b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)go(e)});b.addEventListener('keyup',stop);
}

function reserve(){const q=quote();Object.assign(S,{r:q.r,price:q.price,risk:q.risk,h:q.h,plate:q.v.p,stage:'offer'});$('k1').textContent='18';render()}
function accept(){S.stage='trip';S.run=true;S.prog=0;$('k1').textContent='19';render()}
function simAlert(){
  const p=Math.min(S.prog+.16,.95),rt=$('rt'),pt=rt.getPointAtLength(rt.getTotalLength()*p);
  let acc=0,i=1;for(;i<S.r.path.length;i++){acc+=edge(S.r.path[i-1],S.r.path[i])[2];if(acc/S.r.km>=p)break}
  S.aw=S.r.path[Math.min(i,S.r.path.length-1)-1]+' – '+S.r.path[Math.min(i,S.r.path.length-1)];
  S.alerts.unshift({t:'Robo confirmado',w:S.aw,ago:'Avisó a 214 conductores',lvl:'',e:E[0],xy:[pt.x,pt.y],mine:true});
  S.alertUsed=true;S.run=false;S.stage='alert';render();
}
function stopTruck(){
  S.stage='trip';S.stopped=true;render();
  setTimeout(()=>{if(!S.stopped)return;const w=$('wait');if(w)w.textContent='Vía despejada. Puede seguir.'},2600);
  setTimeout(()=>{if(!S.stopped)return;S.stopped=false;const a=S.alerts.find(x=>x.mine);if(a){a.lvl='g';a.t='Alerta resuelta';a.ago='Vía despejada'}S.run=true;render()},4300);
}
function panic(){
  S.run=false;S.panicUsed=true;
  const box=$('inc');box.innerHTML=`<h2>Pánico silencioso · ${S.plate}</h2><p>Jairo R. · ST-${S.id} · a ${Math.round(S.r.km*(1-S.prog))} km de ${S.d}</p><ul id="il"><li>Ubicación recibida en la central 24/7</li><li>Protocolo abierto y llamada de verificación</li><li>Contacto con la Policía</li><li>Conductores cercanos avisados</li></ul><button class="ghost" id="ic">Cerrar incidente</button>`;
  box.classList.add('on');[...$('il').children].forEach((l,i)=>setTimeout(()=>l.classList.add('d'),400+i*750));
  $('ic').onclick=()=>{box.classList.remove('on');S.run=true;guide()};guide();
}
function guide(){
  const n={quote:1,offer:2,trip:S.alertUsed?(S.panicUsed?5:4):3,alert:3,arrive:5,done:6}[S.stage];
  $('steps').innerHTML=Array.from({length:STEPS},(_,i)=>`<span class="${i+1<n?'d':i+1===n?'n':''}">${i+1}</span>`).join('');
  const H={quote:['Cotiza una ruta real.','Baja el precio para ver el bloqueo legal y luego reserva.'],offer:['La oferta llegó al celular del conductor.','Toca Aceptar viaje en el celular.'],alert:['El conductor recibió la alerta.','Elige una opción en el celular.'],arrive:['El camión llegó a su destino.','Completa el cumplido en el celular.'],done:['Viaje cerrado, con la utilidad a la vista.','Sin llamadas ni papeles.']};
  const tr=S.alertUsed?['El viaje sigue en ruta.','Mantén PÁNICO en el celular para ver la central en acción.']:['El viaje va en ruta, en vivo.','Simula un robo adelante del camión.'];
  const h=S.stage==='trip'?tr:H[S.stage];
  $('hint').innerHTML=`${h[0]}<small>${h[1]}</small>`;
  const g=$('gact');g.innerHTML='';
  const add=(t,c,f)=>{const b=document.createElement('button');b.className=c;b.textContent=t;b.onclick=f;g.appendChild(b)};
  if(S.stage==='trip'&&!S.alertUsed&&S.run)add('Simular robo adelante','cta',simAlert);
  if(S.stage==='trip'&&S.run)add('Llevar a destino','ghost',()=>{S.prog=1});
  if(S.stage!=='quote')add('Reiniciar','ghost',reset);
}
function render(){if(S.stage==='quote'){S.r=null}left();phone();drawMap();guide()}

let last=0;
function loop(t){
  const dt=Math.min(t-last,100);last=t;
  drawFleet(t);
  if(S.run&&S.stage==='trip'&&!$('inc').classList.contains('on')){
    S.prog=Math.min(1,S.prog+dt/42000);progress();tick0();tickP();
    if(S.prog>=1){S.run=false;S.stage='arrive';render()}
  }
  requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
