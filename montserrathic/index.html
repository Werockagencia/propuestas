<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Montserrat II · Pauta HIC</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--or:#EE8023;--bosque:#13251A;--muted:#a9bcae}
*{box-sizing:border-box}
body{margin:0;background:var(--bosque);color:#fff;font-family:'Red Hat Display',system-ui,sans-serif}
body.lock{overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;max-width:1500px;margin:0 auto;padding:22px 16px}
.top b{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--or)}
.top .r{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top small{color:var(--muted);font-size:13px}
.top a{color:#fff;background:var(--or);text-decoration:none;font-weight:700;font-size:14px;padding:10px 18px;border-radius:30px}
main{max-width:1500px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:18px}
.sl{position:relative;margin:0;border-radius:10px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.sl img{width:100%;height:auto;display:block}
/* zona clickeable sobre cada pieza */
.hs{all:unset;position:absolute;cursor:zoom-in;border-radius:6px;transition:box-shadow .15s,background .15s}
.hs:hover,.hs:focus-visible{box-shadow:0 0 0 3px var(--or);background:rgba(238,128,35,.08)}
.hs::after{content:'Ver en detalle';position:absolute;right:8px;bottom:8px;background:var(--or);color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:14px;opacity:0;transition:opacity .15s;white-space:nowrap}
.hs:hover::after,.hs:focus-visible::after{opacity:1}
@media (hover:none){.hs{box-shadow:0 0 0 2px rgba(238,128,35,.55)}}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 40px}

/* Modal */
.lb{position:fixed;inset:0;background:rgba(8,14,10,.97);display:flex;flex-direction:column;z-index:10}
.lb[hidden]{display:none}
.lb .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));font-size:14px}
.lb .bar .t{color:#fff;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .bar .t span{color:var(--muted);font-weight:500;margin-left:8px}
.lb .ctrls{display:flex;gap:8px;flex-shrink:0}
.lb .ctrls button{all:unset;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px;padding:9px 14px;border-radius:20px}
.lb .ctrls button:hover{background:rgba(255,255,255,.22)}
.lb .ctrls button:focus-visible{outline:2px solid var(--or)}
.lb .stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:zoom-in;min-height:0}
.lb .stage img{max-width:94vw;max-height:calc(100vh - 140px);display:block;border-radius:4px;user-select:none}
.lb .stage.zoom{display:block;cursor:zoom-out}
.lb .stage.zoom img{max-width:none;max-height:none;width:auto;height:auto;margin:0 auto}
.lb .arrow{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:26px;display:grid;place-items:center;cursor:pointer;border:0}
.lb .arrow:hover{background:var(--or)}
.lb .prev{left:14px}.lb .next{right:14px}
.lb .hint{text-align:center;color:var(--muted);font-size:12px;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px))}
@media (max-width:700px){.lb .arrow{width:42px;height:42px;font-size:20px;top:auto;bottom:56px;transform:none}}
</style></head><body>
<div class="top"><b>Montserrat Etapa II × HIC</b><div class="r"><small>Toca cualquier pieza para verla en detalle</small><a href="Montserrat_Pauta_HIC.pdf" download>Descargar PDF</a></div></div>
<main id="g"></main>
<footer>Montserrat Etapa II · Azulado Inmobiliario</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Detalle de la pieza">
  <div class="bar"><div class="t" id="lbT"></div><div class="ctrls"><button id="lbZ" type="button">Tamaño real</button><button id="lbX" type="button" aria-label="Cerrar">Cerrar ✕</button></div></div>
  <div class="stage" id="lbS"><img id="lbI" alt=""></div>
  <button class="arrow prev" id="lbP" type="button" aria-label="Anterior">‹</button>
  <button class="arrow next" id="lbN" type="button" aria-label="Siguiente">›</button>
  <div class="hint">Clic en la imagen para verla a tamaño real · flechas ← → para pasar de pieza · Esc para cerrar</div>
</div>
<script>
(function(){
  var V='?v=9', D='r5/piezas/';
  var VB='Valla 5 × 2 m', CJ='Caja de luz sótano 3 · 2,5 × 1,1 m', AS='Puertas ascensor · 1 × 2,09 m';
  var P={
    vb:['R5_valla_5x2_blanca.jpg',VB+' · versión blanca'], vv:['R5_valla_5x2_verde.jpg',VB+' · versión verde'],
    svb:['situ_R5valla_blanca.jpg',VB+' · blanca · simulación en el parqueadero'], svv:['situ_R5valla_verde.jpg',VB+' · verde · simulación en el parqueadero'],
    cb:['R5_cajaluz_2.5x1.1_blanca.jpg',CJ+' · versión blanca'], cv:['R5_cajaluz_2.5x1.1_verde.jpg',CJ+' · versión verde'],
    scb:['situ_R5caja_blanca.jpg',CJ+' · blanca · simulación en el pasillo'], scv:['situ_R5caja_verde.jpg',CJ+' · verde · simulación en el pasillo'],
    ab:['R5_ascensor_1x2.09_blanca.jpg',AS+' · versión blanca'], av:['R5_ascensor_1x2.09_verde.jpg',AS+' · versión verde'],
    sab:['situ_R5asc_blanca.jpg',AS+' · blanca · simulación en el ascensor'], sav:['situ_R5asc_verde.jpg',AS+' · verde · simulación en el ascensor']
  };
  /* zonas clickeables: [x,y,ancho,alto] en px de la lámina 1920 x 1080 + pieza */
  var S=[
    ['Portada',[[110,630,548,260,'svb'],[686,630,548,260,'scv'],[1262,630,548,260,'sab']]],
    ['Lo que cambió',[]],
    ['Valla: blanca y verde',[[70,140,1150,460,'vb'],[70,600,1150,460,'vv'],[1260,300,600,261,'svb'],[1260,760,600,261,'svv']]],
    ['Valla · versión blanca',[[70,140,1780,712,'vb'],[1530,880,320,139,'svb']]],
    ['Valla · versión verde',[[70,140,1780,712,'vv'],[1530,880,320,139,'svv']]],
    ['Caja de luz: blanca y verde',[[70,140,1000,440,'cb'],[70,610,1000,440,'cv'],[1520,140,330,440,'scb'],[1520,610,330,440,'scv']]],
    ['Caja de luz · versión blanca',[[70,150,1480,651,'cb'],[1590,150,260,347,'scb']]],
    ['Caja de luz · versión verde',[[70,150,1480,651,'cv'],[1590,150,260,347,'scv']]],
    ['Ascensor: blanca y verde',[[70,130,411,860,'ab'],[501,130,411,860,'av'],[1440,130,200,304,'sab'],[1660,130,200,304,'sav']]],
    ['Ascensor · versión blanca',[[560,110,440,920,'ab'],[1060,430,395,600,'sab']]],
    ['Ascensor · versión verde',[[560,110,440,920,'av'],[1060,430,395,600,'sav']]],
    ['¿Blanca o verde?',[]]
  ];
  var ORDER=['vb','vv','svb','svv','cb','cv','scb','scv','ab','av','sab','sav'];
  var g=document.getElementById('g');
  S.forEach(function(s,i){
    var f=document.createElement('figure');f.className='sl';
    var n=('0'+(i+1)).slice(-2);
    f.innerHTML='<img src="r5/s-'+n+'.jpg'+V+'" alt="'+s[0]+'" loading="'+(i<2?'eager':'lazy')+'">';
    s[1].forEach(function(h){
      var b=document.createElement('button');b.className='hs';b.type='button';
      b.style.left=(h[0]/19.2)+'%';b.style.top=(h[1]/10.8)+'%';b.style.width=(h[2]/19.2)+'%';b.style.height=(h[3]/10.8)+'%';
      b.setAttribute('aria-label','Ver en detalle: '+P[h[4]][1]);b.dataset.k=h[4];
      b.addEventListener('click',function(){open(ORDER.indexOf(h[4]),b)});
      f.appendChild(b);
    });
    g.appendChild(f);
  });
  var lb=document.getElementById('lb'),img=document.getElementById('lbI'),st=document.getElementById('lbS'),
      t=document.getElementById('lbT'),z=document.getElementById('lbZ'),cur=0,last=null;
  function show(i){
    cur=(i+ORDER.length)%ORDER.length;var p=P[ORDER[cur]];
    setZoom(false);img.src=D+p[0]+V;img.alt=p[1];
    t.innerHTML=p[1]+'<span>'+(cur+1)+' / '+ORDER.length+'</span>';
    new Image().src=D+P[ORDER[(cur+1)%ORDER.length]][0]+V;
  }
  function open(i,from){last=from;lb.hidden=false;document.body.classList.add('lock');show(i);z.focus()}
  function close(){lb.hidden=true;document.body.classList.remove('lock');setZoom(false);if(last)last.focus()}
  function setZoom(on){st.classList.toggle('zoom',on);z.textContent=on?'Ajustar a pantalla':'Tamaño real'}
  function toggleZoom(e){
    var on=!st.classList.contains('zoom');var r=img.getBoundingClientRect();
    var fx=e&&e.clientX?(e.clientX-r.left)/r.width:.5,fy=e&&e.clientY?(e.clientY-r.top)/r.height:.5;
    setZoom(on);
    if(on)requestAnimationFrame(function(){st.scrollLeft=fx*img.offsetWidth-st.clientWidth/2;st.scrollTop=fy*img.offsetHeight-st.clientHeight/2});
  }
  img.addEventListener('click',function(e){e.stopPropagation();toggleZoom(e)});
  st.addEventListener('click',function(e){if(e.target===st&&!st.classList.contains('zoom'))close()});
  z.addEventListener('click',function(){toggleZoom()});
  document.getElementById('lbX').addEventListener('click',close);
  document.getElementById('lbP').addEventListener('click',function(){show(cur-1)});
  document.getElementById('lbN').addEventListener('click',function(){show(cur+1)});
  document.addEventListener('keydown',function(e){if(lb.hidden)return;
    if(e.key==='Escape')close();else if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1)});
  var x0=null;st.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  st.addEventListener('touchend',function(e){if(x0===null||st.classList.contains('zoom'))return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));x0=null});
})();
</script>
</body></html>
